buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.9.1'
    }
}

import proguard.gradle.ProGuardTask
import org.gradle.api.attributes.java.TargetJvmVersion
import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

apply plugin: 'com.gradleup.shadow'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

configurations.matching { it.name in ['compileClasspath', 'runtimeClasspath'] }.configureEach {
    attributes.attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
}

configurations {
    invuiV2Shade {
        canBeConsumed = false
        canBeResolved = true
    }
}

def shadowJarTask = tasks.named('shadowJar')
def unobfuscatedJarFile = layout.buildDirectory.file('libs/MinecraftBot-unobfuscated.jar')
def obfuscatedJarFile = layout.buildDirectory.file('libs/MinecraftBot.jar')
def legacyObfuscatedJarFile = layout.buildDirectory.file('libs/MinecraftBot-obf.jar')
def proguardMappingFile = layout.buildDirectory.file('reports/proguard/mapping.txt')
def javaToolchainService = extensions.getByType(org.gradle.jvm.toolchain.JavaToolchainService)
def proguardJdkHome = javaToolchainService.launcherFor {
    languageVersion = org.gradle.jvm.toolchain.JavaLanguageVersion.of(21)
}.get().metadata.installationPath.asFile
def javaBaseJmod = new File(proguardJdkHome, 'jmods/java.base.jmod')
def javaLoggingJmod = new File(proguardJdkHome, 'jmods/java.logging.jmod')
def externalClasspathFor = { Project dependencyProject ->
    dependencyProject.sourceSets.main.compileClasspath.filter { candidate ->
        candidate.exists() && !candidate.toPath().startsWith(rootDir.toPath())
    }
}
def proguardLibraries = files(
    javaBaseJmod,
    javaLoggingJmod,
    externalClasspathFor(project(':mcbot-core')),
    externalClasspathFor(project(':versions:v1_21_4')),
    externalClasspathFor(project(':versions:v1_21_5')),
    externalClasspathFor(project(':versions:v1_21_6')),
    externalClasspathFor(project(':versions:v1_21_7')),
    externalClasspathFor(project(':versions:v1_21_8')),
    externalClasspathFor(project(':versions:v1_21_9')),
    externalClasspathFor(project(':versions:v1_21_10')),
    externalClasspathFor(project(':versions:v1_21_11')),
    externalClasspathFor(project(':versions:v26_1'))
)

if (!javaBaseJmod.exists() || !javaLoggingJmod.exists()) {
    throw new GradleException("ProGuard requires a Java 21 JDK with jmods. Resolved toolchain: ${proguardJdkHome}")
}

dependencies {
    implementation project(':mcbot-core')
    implementation project(path: ':versions:v1_21_4', configuration: 'reobf')
    implementation project(path: ':versions:v1_21_5', configuration: 'reobf')
    implementation project(path: ':versions:v1_21_6', configuration: 'reobf')
    implementation project(path: ':versions:v1_21_7', configuration: 'reobf')
    implementation project(path: ':versions:v1_21_8', configuration: 'reobf')
    implementation project(path: ':versions:v1_21_9', configuration: 'reobf')
    implementation project(path: ':versions:v1_21_10', configuration: 'reobf')
    implementation project(path: ':versions:v1_21_11', configuration: 'reobf')
    implementation(project(path: ':versions:v26_1', configuration: 'runtimeElements')) {
        transitive = false
    }
    invuiV2Shade "xyz.xenondevs.invui:invui:2.2.0"
}

def relocateInvuiV2Task = tasks.register('relocateInvuiV2', ShadowJar) {
    archiveFileName.set('invui-v2-relocated.jar')
    destinationDirectory.set(layout.buildDirectory.dir('tmp/shadow'))
    configurations = [project.configurations.invuiV2Shade]
    mergeServiceFiles()
    relocate('xyz.xenondevs.invui', 'com.monkey.mcbot.libs.invui.v2')
    relocate('xyz.xenondevs.inventoryaccess', 'com.monkey.mcbot.libs.inventoryaccess.v2')
}

shadowJar {
    dependsOn relocateInvuiV2Task
    archiveFileName.set('MinecraftBot-unobfuscated.jar')
    mergeServiceFiles()
    from({
        zipTree(relocateInvuiV2Task.get().archiveFile.get().asFile)
    })
    relocate('org.bstats', 'com.monkey.mcbot.libs.bstats')
    relocate('com.fasterxml.jackson', 'com.monkey.mcbot.libs.jackson')
    relocate('xyz.xenondevs.invui', 'com.monkey.mcbot.libs.invui.v1') {
        exclude 'com/monkey/mcbot/gui/v26_1/**'
    }
    relocate('xyz.xenondevs.inventoryaccess', 'com.monkey.mcbot.libs.inventoryaccess.v1') {
        exclude 'com/monkey/mcbot/gui/v26_1/**'
    }
    relocate('xyz.xenondevs.invui', 'com.monkey.mcbot.libs.invui.v2') {
        include 'com/monkey/mcbot/gui/v26_1/**'
    }
    relocate('xyz.xenondevs.inventoryaccess', 'com.monkey.mcbot.libs.inventoryaccess.v2') {
        include 'com/monkey/mcbot/gui/v26_1/**'
    }
    doLast {
        def jarFile = archiveFile.get().asFile
        def patchedJar = new File(jarFile.parentFile, "${jarFile.name}.patched")
        def v26Prefixes = [
                'com/monkey/mcbot/gui/v26_1/'
        ]
        def maxClassMajor = 65 // Java 21, required for legacy Paper remapper (ASM 9.7.1)

        def retarget = { byte[] bytes ->
            def binary = new String(bytes, 'ISO-8859-1')
                    .replace('com/monkey/mcbot/libs/invui/v1/', 'com/monkey/mcbot/libs/invui/v2/')
                    .replace('com/monkey/mcbot/libs/inventoryaccess/v1/', 'com/monkey/mcbot/libs/inventoryaccess/v2/')
            return binary.getBytes('ISO-8859-1')
        }

        def normalizeClassMajor = { byte[] bytes ->
            if (bytes == null || bytes.length < 8) {
                return bytes
            }

            if ((bytes[0] & 0xFF) != 0xCA || (bytes[1] & 0xFF) != 0xFE || (bytes[2] & 0xFF) != 0xBA || (bytes[3] & 0xFF) != 0xBE) {
                return bytes
            }

            int major = ((bytes[6] & 0xFF) << 8) | (bytes[7] & 0xFF)
            if (major > maxClassMajor) {
                bytes[6] = (byte) ((maxClassMajor >> 8) & 0xFF)
                bytes[7] = (byte) (maxClassMajor & 0xFF)
            }
            return bytes
        }

        def zip = new java.util.zip.ZipFile(jarFile)
        def zos = new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(patchedJar))

        try {
            zip.entries().each { entry ->
                def newEntry = new java.util.zip.ZipEntry(entry.name)
                newEntry.time = entry.time
                zos.putNextEntry(newEntry)
                def data = zip.getInputStream(entry).bytes

                if (!entry.isDirectory()
                        && entry.name.endsWith('.class')
                        && v26Prefixes.any { entry.name.startsWith(it) }) {
                    data = retarget(data)
                }

                if (!entry.isDirectory() && entry.name.endsWith('.class')) {
                    data = normalizeClassMajor(data)
                }

                zos.write(data)
                zos.closeEntry()
            }
        } finally {
            zos.close()
            zip.close()
        }

        if (!jarFile.delete() || !patchedJar.renameTo(jarFile)) {
            throw new GradleException("Failed to patch ${jarFile.name} with v26 InvUI v2 references")
        }
    }
}

tasks.register('obfuscatePluginJar', ProGuardTask) {
    dependsOn shadowJarTask

    doFirst {
        delete legacyObfuscatedJarFile.get().asFile
    }

    injars shadowJarTask.get().archiveFile.get().asFile
    outjars obfuscatedJarFile.get().asFile

    configuration file("$projectDir/proguard.pro")
    libraryjars proguardLibraries
    printmapping proguardMappingFile.get().asFile
}

shadowJarTask.configure {
    finalizedBy tasks.named('obfuscatePluginJar')
}

build.dependsOn shadowJar
