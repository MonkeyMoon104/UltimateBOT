license-key: "XXXX-XXXX-XXXX-XXXX"
lang-file: "EN.yml"

updates:
  join-notify-delay-seconds: 5
  periodic-broadcast:
    enabled: true
    interval-minutes: 30

remote-api:
  enabled: false
  host: "127.0.0.1"
  port: 8765
  base-path: "/ultimatebot/api/v1"
  token: "change-me"

addons:
  metrics:
    # Downloads UltimateBot-Metrics.jar automatically on the next full server restart.
    enabled: false
    # Exposes authenticated Prometheus data at <remote-api.base-path>/metrics when the addon is enabled.
    prometheus-endpoint-enabled: false
  # Downloads UltimateBot-Guard.jar automatically on the next full server restart.
  # Detection and protection rules are intentionally hardcoded by the addon.
  guard:
    enabled: true

performance:
  caches:
    # Short-lived player target results. Values are validated and safely fall back to defaults.
    target:
      maximum-size: 2048
      expire-after-write-ms: 250
    # Passability checks used by pathfinding and movement.
    block-state:
      maximum-size: 1000
      expire-after-write-ms: 5000

bot:
  name: "UltimateBot"
  default-totem-count: -1
  max-totem-normal: 37
  max-totem-event: 74
  blocked-worlds:
    - "world_nether"
    - "world_the_end"
  combat:
    infinite-resources: true
    healing: true
    # Keep entity damage/knockback while deciding independently whether bot explosions break terrain.
    explosion-block-damage: false

  event:
    range: 32

  ally:
    range: 16
    pre-range: 32
    return-teleport-distance: 12
    return-teleport-cooldown-ms: 1000

  team-ally:
    range: 16
    pre-range: 32
    return-teleport-distance: 12
    return-teleport-cooldown-ms: 1000
