gui:
  tab-border:
    material: BLACK_STAINED_GLASS_PANE
    name: ' '
  tab-item:
    tab-0:
      selected:
        material: SHIELD
        name: '&eキット &7(選択中)'
      unselected:
        material: SHIELD
        name: '&7キット'
    tab-1:
      selected:
        material: GLOWSTONE_DUST
        name: '&eランク &7(選択中)'
      unselected:
        material: GUNPOWDER
        name: '&7ランク'
    tab-2:
      selected:
        material: DRAGON_HEAD
        name: '&e所有者 &7(選択中)'
      unselected:
        material: DRAGON_HEAD
        name: '&7所有者'
    tab-3:
      selected:
        material: TARGET
        name: '&eターゲット &7(選択中)'
      unselected:
        material: TARGET
        name: '&7ターゲット'
  owners-tab:
    head:
      name: '&e%player%'
      lore:
      - '&7ボット所有者'
      - ''
      - '&8UUID: &7%uuid%'
    scroll-up:
      name: '&a上へスクロール'
      cant-scroll: '&7すでに一番上です'
    scroll-down:
      name: '&a下へスクロール'
      cant-scroll: '&7すでに一番下です'
  targets-tab:
    head:
      name: '&c%player%'
      lore:
      - '&7ボットのターゲット'
      - ''
      - '&8UUID: &7%uuid%'
    scroll-up:
      name: '&a上へスクロール'
      cant-scroll: '&7すでに一番上です'
    scroll-down:
      name: '&a下へスクロール'
      cant-scroll: '&7すでに一番下です'
  default-armor:
    helmet: NETHERITE
    chestplate: NETHERITE
    leggings: NETHERITE
    boots: NETHERITE
    no-armor: BARRIER
    blast-enabled-text: '&aON'
    blast-disabled-text: '&cOFF'
    lore:
      set-type:
      - '&7タイプ: &e%type%'
      - '&7爆発耐性: %blast_state%'
      - ''
      - '&e左クリック: &7防具パーツを変更'
      - '&e右クリック: &7爆発を切り替え'
  follow-button:
    name: '&bFollow 切り替え'
    material: LEAD
    lore:
    - '&7状態: &e%type%'
    - ''
    - '&eクリックして Follow を切り替え'
  spawn-button:
    name: '&aボットをスポーン'
    material: SPAWNER
    lore:
    - '&7練習用ボットをスポーンします'
    - '&7選択した設定で'
    - ''
    - '&eクリックしてスポーン！'
  despawn-button:
    name: '&cボットを削除'
    material: BARRIER
    lore:
    - '&7練習用ボットを削除します'
    - '&7ワールドから'
    - ''
    - '&cクリックして削除！'
  save-button:
    name: '&a変更を保存'
    material: GREEN_WOOL
    lore:
    - '&7現在の設定を保存します'
    - '&7アクティブなボットに'
    - ''
    - '&aクリックして保存！'
  totem-button:
    name: '&eトーテム数'
    material: TOTEM_OF_UNDYING
    unlimited-text: 無制限
    lore:
    - '&7現在の数: &a%count%'
    - ''
    - '&e左クリック: &a+1'
    - '&e右クリック: &c-1'
    - '&7(-1 = 無制限トーテム)'
  teleport-button:
    name: '&5ボットをテレポート'
    material: ENDER_PEARL
    lore:
    - '&dボットをあなたの場所へテレポートします'
  combat-button:
    name: '&b戦闘切り替え'
    material: NETHERITE_SWORD
    lore:
    - '&7状態: &e%type%'
    - ''
    - '&eクリックして戦闘を切り替え'
  rank-button:
    name: '&bランク'
    material: DIAMOND_SWORD
    ranks-mat:
      easy: SMALL_AMETHYST_BUD
      normal: SMALL_AMETHYST_BUD
      medium: MEDIUM_AMETHYST_BUD
      hard: LARGE_AMETHYST_BUD
      god: AMETHYST_CLUSTER
    lore:
    - ''
    - '%ranks%'
    - ''
    - '&eクリックしてランクを上げ/下げ'
