gui:
  tab-border:
    material: BLACK_STAINED_GLASS_PANE
    name: ' '
  tab-item:
    tab-0:
      selected:
        material: SHIELD
        name: '&eKit &7(geselecteerd)'
      unselected:
        material: SHIELD
        name: '&7Kit'
    tab-1:
      selected:
        material: GLOWSTONE_DUST
        name: '&eRang &7(geselecteerd)'
      unselected:
        material: GUNPOWDER
        name: '&7Rang'
    tab-2:
      selected:
        material: DRAGON_HEAD
        name: '&eEigenaren &7(geselecteerd)'
      unselected:
        material: DRAGON_HEAD
        name: '&7Eigenaren'
    tab-3:
      selected:
        material: TARGET
        name: '&eDoelen &7(geselecteerd)'
      unselected:
        material: TARGET
        name: '&7Doelen'
  owners-tab:
    head:
      name: '&e%player%'
      lore:
      - '&7Bot-eigenaar'
      - ''
      - '&8UUID: &7%uuid%'
    scroll-up:
      name: '&aOmhoog scrollen'
      cant-scroll: '&7Je bent al bovenaan'
    scroll-down:
      name: '&aOmlaag scrollen'
      cant-scroll: '&7Je bent al onderaan'
  targets-tab:
    head:
      name: '&c%player%'
      lore:
      - '&7Bot-doel'
      - ''
      - '&8UUID: &7%uuid%'
    scroll-up:
      name: '&aOmhoog scrollen'
      cant-scroll: '&7Je bent al bovenaan'
    scroll-down:
      name: '&aOmlaag scrollen'
      cant-scroll: '&7Je bent al onderaan'
  default-armor:
    helmet: NETHERITE
    chestplate: NETHERITE
    leggings: NETHERITE
    boots: NETHERITE
    no-armor: BARRIER
    blast-enabled-text: '&aON'
    blast-disabled-text: '&cOFF'
    lore:
      set-type:
      - '&7Type: &e%type%'
      - '&7Blast Protection: %blast_state%'
      - ''
      - '&eLinkerklik: &7verander het armorstuk'
      - '&eRechterklik: &7schakel blast'
  follow-button:
    name: '&bFollow schakelen'
    material: LEAD
    lore:
    - '&7Status: &e%type%'
    - ''
    - '&eKlik om follow te schakelen'
  spawn-button:
    name: '&aBot spawnen'
    material: SPAWNER
    lore:
    - '&7Spawn je oefenbot'
    - '&7met de geselecteerde configuratie'
    - ''
    - '&eKlik om te spawnen!'
  despawn-button:
    name: '&cBot verwijderen'
    material: BARRIER
    lore:
    - '&7Verwijder je oefenbot'
    - '&7uit de wereld'
    - ''
    - '&cKlik om te verwijderen!'
  save-button:
    name: '&aWijzigingen opslaan'
    material: GREEN_WOOL
    lore:
    - '&7Slaat de huidige instellingen op'
    - '&7voor de actieve bot'
    - ''
    - '&aKlik om op te slaan!'
  totem-button:
    name: '&eTotem-aantal'
    material: TOTEM_OF_UNDYING
    unlimited-text: Onbeperkt
    lore:
    - '&7Huidig aantal: &a%count%'
    - ''
    - '&eLinkerklik: &a+1'
    - '&eRechterklik: &c-1'
    - '&7(-1 = Onbeperkte totems)'
  teleport-button:
    name: '&5Bot teleporteren'
    material: ENDER_PEARL
    lore:
    - '&dTeleporteert de bot naar jouw locatie'
  combat-button:
    name: '&bCombat schakelen'
    material: NETHERITE_SWORD
    lore:
    - '&7Status: &e%type%'
    - ''
    - '&eKlik om combat te schakelen'
  rank-button:
    name: '&bRang'
    material: DIAMOND_SWORD
    ranks-mat:
      easy: SMALL_AMETHYST_BUD
      normal: SMALL_AMETHYST_BUD
      medium: MEDIUM_AMETHYST_BUD
      hard: LARGE_AMETHYST_BUD
      god: AMETHYST_CLUSTER
    lore:
    - ''
    - '%ranks%'
    - ''
    - '&eKlik om de rang te verhogen/verlagen'
