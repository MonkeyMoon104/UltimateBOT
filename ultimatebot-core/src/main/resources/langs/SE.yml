gui:
  tab-border:
    material: BLACK_STAINED_GLASS_PANE
    name: ' '
  tab-item:
    tab-0:
      selected:
        material: SHIELD
        name: '&eKit &7(vald)'
      unselected:
        material: SHIELD
        name: '&7Kit'
    tab-1:
      selected:
        material: GLOWSTONE_DUST
        name: '&eDifficulty &7(vald)'
      unselected:
        material: GUNPOWDER
        name: '&7Difficulty'
    tab-2:
      selected:
        material: DRAGON_HEAD
        name: '&eÄgare &7(valda)'
      unselected:
        material: DRAGON_HEAD
        name: '&7Ägare'
    tab-3:
      selected:
        material: TARGET
        name: '&eMål &7(vald)'
      unselected:
        material: TARGET
        name: '&7Mål'
  owners-tab:
    head:
      name: '&e%player%'
      lore:
      - '&7Botägare'
      - ''
      - '&8UUID: &7%uuid%'
    scroll-up:
      name: '&aRulla upp'
      cant-scroll: '&7Du är redan högst upp'
    scroll-down:
      name: '&aRulla ner'
      cant-scroll: '&7Du är redan längst ner'
  targets-tab:
    head:
      name: '&c%player%'
      lore:
      - '&7Botmål'
      - ''
      - '&8UUID: &7%uuid%'
    scroll-up:
      name: '&aRulla upp'
      cant-scroll: '&7Du är redan högst upp'
    scroll-down:
      name: '&aRulla ner'
      cant-scroll: '&7Du är redan längst ner'
  default-armor:
    helmet: NETHERITE
    chestplate: NETHERITE
    leggings: NETHERITE
    boots: NETHERITE
    no-armor: BARRIER
    blast-enabled-text: '&aON'
    blast-disabled-text: '&cOFF'
    lore:
      set-type:
      - '&7Typ: &e%type%'
      - '&7Explosionsskydd: %blast_state%'
      - ''
      - '&eVänsterklick: &7ändra rustningsdel'
      - '&eHögerklick: &7växla blast'
  follow-button:
    name: '&bVäxla Follow'
    material: LEAD
    lore:
    - '&7Status: &e%type%'
    - ''
    - '&eKlicka för att växla follow'
  spawn-button:
    name: '&aSpawna bot'
    material: SPAWNER
    lore:
    - '&7Spawna din träningsbot'
    - '&7med den valda konfigurationen'
    - ''
    - '&eKlicka för att spawna!'
  despawn-button:
    name: '&cTa bort bot'
    material: BARRIER
    lore:
    - '&7Ta bort din träningsbot'
    - '&7från världen'
    - ''
    - '&cKlicka för att ta bort!'
  save-button:
    name: '&aSpara ändringar'
    material: GREEN_WOOL
    lore:
    - '&7Spara de aktuella inställningarna'
    - '&7till den aktiva boten'
    - ''
    - '&aKlicka för att spara!'
  totem-button:
    name: '&eAntal totems'
    material: TOTEM_OF_UNDYING
    unlimited-text: Obegränsat
    lore:
    - '&7Nuvarande antal: &a%count%'
    - ''
    - '&eVänsterklick: &a+1'
    - '&eHögerklick: &c-1'
    - '&7(-1 = Obegränsade totems)'
  teleport-button:
    name: '&5Teleportera bot'
    material: ENDER_PEARL
    lore:
    - '&dTeleportera boten till din plats'
  combat-button:
    name: '&bVäxla strid'
    material: NETHERITE_SWORD
    lore:
    - '&7Status: &e%type%'
    - ''
    - '&eKlicka för att växla strid'
  difficulty-button:
    name: '&bDifficulty'
    material: DIAMOND_SWORD
    difficulties-mat:
      easy: SMALL_AMETHYST_BUD
      normal: SMALL_AMETHYST_BUD
      medium: MEDIUM_AMETHYST_BUD
      hard: LARGE_AMETHYST_BUD
      god: AMETHYST_CLUSTER
    lore:
    - ''
    - '%difficulties%'
    - ''
    - '&eKlicka för att öka/minska difficulty'
