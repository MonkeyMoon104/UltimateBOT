    name: '&aSpawna bot'
    material: SPAWNER
    lore:
    - '&7Spawn din træningsbot'
    - '&7med den valda konfigurationen'
    - ''
    - '&eKlicka för att spawna!'
  despawn-button:
    name: '&cFjern bot'
    material: BARRIER
    lore:
    - '&7Fjern din træningsbot'
    - '&7fra verden'
    - ''
    - '&cKlicka för att ta bort!'
  save-button:
    name: '&aSpara ändringar'
    material: GREEN_WOOL
    lore:
    - '&7Gem de nuværende indstillinger'
    - '&7på den aktive bot'
    - ''
