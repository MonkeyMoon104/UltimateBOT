      selected:
        material: SHIELD
        name: '&eKit &7(valgt)'
      unselected:
        material: SHIELD
        name: '&7Kit'
    tab-1:
      selected:
        material: GLOWSTONE_DUST
        name: '&eRank &7(valgt)'
      unselected:
        material: GUNPOWDER
        name: '&7Rank'
    tab-2:
      selected:
        material: DRAGON_HEAD
        name: '&eEjere &7(valgt)'
      unselected:
        material: DRAGON_HEAD
        name: '&7Ejere'
    tab-3:
      selected:
        material: TARGET
        name: '&eMål &7(valgt)'
      unselected:
        material: TARGET
        name: '&7Mål'
  owners-tab:
    head:
      name: '&e%player%'
      lore:
      - '&7Bot-ejer'
      - ''
      - '&8UUID: &7%uuid%'
    scroll-up:
      name: '&aRul op'
      cant-scroll: '&7Du er allerede øverst'
    scroll-down:
      name: '&aRul ned'
      cant-scroll: '&7Du er allerede nederst'
  targets-tab:
    head:
      name: '&c%player%'
      lore:
      - '&7Bot-mål'
      - ''
      - '&8UUID: &7%uuid%'
    scroll-up:
      name: '&aRul op'
      cant-scroll: '&7Du er allerede øverst'
    scroll-down:
      name: '&aRul ned'
      cant-scroll: '&7Du er allerede nederst'
