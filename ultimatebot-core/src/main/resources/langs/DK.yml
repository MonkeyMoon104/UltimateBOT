    helmet: NETHERITE
    chestplate: NETHERITE
    leggings: NETHERITE
    boots: NETHERITE
    no-armor: BARRIER
    blast-enabled-text: '&aON'
    blast-disabled-text: '&cOFF'
    lore:
      set-type:
      - '&7Type: &e%type%'
      - '&7Eksplosionsbeskyttelse: %blast_state%'
      - ''
      - '&eVenstreklik: &7skift rustningsdel'
      - '&eHøjreklik: &7skift blast'
  follow-button:
    name: '&bSkift Follow'
    material: LEAD
    lore:
    - '&7Status: &e%type%'
    - ''
