gui:
  tab-border:
    material: BLACK_STAINED_GLASS_PANE
    name: ' '
  tab-item:
    tab-0:
      selected:
        material: SHIELD
        name: '&eKit &7(selectat)'
      unselected:
        material: SHIELD
        name: '&7Kit'
    tab-1:
      selected:
        material: GLOWSTONE_DUST
        name: '&eDifficulty &7(selectat)'
      unselected:
        material: GUNPOWDER
        name: '&7Difficulty'
    tab-2:
      selected:
        material: DRAGON_HEAD
        name: '&eOwneri &7(selectat)'
      unselected:
        material: DRAGON_HEAD
        name: '&7Owneri'
    tab-3:
      selected:
        material: TARGET
        name: '&eȚinte &7(selectat)'
      unselected:
        material: TARGET
        name: '&7Ținte'
  owners-tab:
    head:
      name: '&e%player%'
      lore:
      - '&7Owner bot'
      - ''
      - '&8UUID: &7%uuid%'
    scroll-up:
      name: '&aDerulează în sus'
      cant-scroll: '&7Ești deja sus'
    scroll-down:
      name: '&aDerulează în jos'
      cant-scroll: '&7Ești deja jos'
  targets-tab:
    head:
      name: '&c%player%'
      lore:
      - '&7Țintă bot'
      - ''
      - '&8UUID: &7%uuid%'
    scroll-up:
      name: '&aDerulează în sus'
      cant-scroll: '&7Ești deja sus'
    scroll-down:
      name: '&aDerulează în jos'
      cant-scroll: '&7Ești deja jos'
  default-armor:
    helmet: NETHERITE
    chestplate: NETHERITE
    leggings: NETHERITE
    boots: NETHERITE
    no-armor: BARRIER
    blast-enabled-text: '&aON'
    blast-disabled-text: '&cOFF'
    lore:
      set-type:
      - '&7Tip: &e%type%'
      - '&7Protecție la explozie: %blast_state%'
      - ''
      - '&eClick stânga: &7schimbă piesa de armură'
      - '&eClick dreapta: &7comută blast'
  follow-button:
    name: '&bComută Follow'
    material: LEAD
    lore:
    - '&7Stare: &e%type%'
    - ''
    - '&eClick pentru a comuta follow'
  spawn-button:
    name: '&aSpawnează Bot'
    material: SPAWNER
    lore:
    - '&7Spawnează botul tău de antrenament'
    - '&7cu configurația selectată'
    - ''
    - '&eClick pentru spawn!'
  despawn-button:
    name: '&cElimină Botul'
    material: BARRIER
    lore:
    - '&7Elimină botul tău de antrenament'
    - '&7din lume'
    - ''
    - '&cClick pentru eliminare!'
  save-button:
    name: '&aSalvează Schimbările'
    material: GREEN_WOOL
    lore:
    - '&7Salvează setările curente'
    - '&7pe botul activ'
    - ''
    - '&aClick pentru salvare!'
  totem-button:
    name: '&eNumăr Toteme'
    material: TOTEM_OF_UNDYING
    unlimited-text: Nelimitat
    lore:
    - '&7Număr curent: &a%count%'
    - ''
    - '&eClick stânga: &a+1'
    - '&eClick dreapta: &c-1'
    - '&7(-1 = Toteme nelimitate)'
  teleport-button:
    name: '&5Teleportează Botul'
    material: ENDER_PEARL
    lore:
    - '&dTeleportează botul la locația ta'
  combat-button:
    name: '&bComută Lupta'
    material: NETHERITE_SWORD
    lore:
    - '&7Stare: &e%type%'
    - ''
    - '&eClick pentru a comuta lupta'
  difficulty-button:
    name: '&bDifficulty'
    material: DIAMOND_SWORD
    difficulties-mat:
      easy: SMALL_AMETHYST_BUD
      normal: SMALL_AMETHYST_BUD
      medium: MEDIUM_AMETHYST_BUD
      hard: LARGE_AMETHYST_BUD
      god: AMETHYST_CLUSTER
    lore:
    - ''
    - '%difficulties%'
    - ''
    - '&eClick pentru a crește/scădea difficulty-ul'
