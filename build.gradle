plugins {
    id 'java'
    id("io.papermc.paperweight.userdev") version "2.0.0-beta.21" apply false
    id 'com.gradleup.shadow' version '9.4.1' apply false
}

subprojects {
    apply plugin: 'java'

    group = 'com.monkey.mcbot'
    version = System.getenv("RELEASE_VERSION") ?: '1.0.0'

    repositories {
        mavenCentral()
        maven { url = "https://repo.papermc.io/repository/maven-public/" }
        maven { url = 'https://repo.xenondevs.xyz/releases' }
        maven { url = 'https://repo.spongepowered.org/maven' }
        maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
        maven { url = "https://nexus.sirblobman.xyz/public/" }
        maven { url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/" }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release.set(21)
        options.compilerArgs += ['-parameters']
    }
}

tasks.register('publishApiDocs', Sync) {
    group = 'documentation'
    description = 'Genera le Javadocs del modulo mcbot-api e le copia nella cartella root docs/ per GitHub Pages.'

    dependsOn ':mcbot-api:javadoc'

    from(project(':mcbot-api').tasks.named('javadoc').map { it.destinationDir })
    into(layout.projectDirectory.dir('docs'))

    doLast {
        file("$rootDir/docs/.nojekyll").text = ''
    }
}
