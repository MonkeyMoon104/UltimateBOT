plugins {
    id 'java'
    alias(libs.plugins.paperweight.userdev) apply false
    alias(libs.plugins.shadow) apply false
}

def runGitCommand = { List<String> args ->
    try {
        def output = providers.exec {
            commandLine(['git'] + args)
            ignoreExitValue = true
        }
        if (output.result.get().exitValue != 0) {
            return null
        }
        def text = output.standardOutput.asText.get().trim()
        return text ? text : null
    } catch (Exception ignored) {
        return null
    }
}

def normalizeTagVersion = { String rawTag ->
    if (!rawTag) {
        return null
    }
    return rawTag.startsWith('v') ? rawTag.substring(1) : rawTag
}

def resolveProjectVersion = {
    def envVersion = System.getenv("RELEASE_VERSION")
    if (envVersion) {
        return envVersion
    }

    def exactTag = runGitCommand(['describe', '--tags', '--exact-match', 'HEAD'])
    if (exactTag) {
        return normalizeTagVersion(exactTag)
    }

    def latestTag = runGitCommand(['describe', '--tags', '--abbrev=0'])
    if (latestTag) {
        return normalizeTagVersion(latestTag)
    }

    return '1.0.0'
}

def projectVersion = resolveProjectVersion()

subprojects {
    apply plugin: 'java'

    group = 'com.monkey.mcbot'
    version = projectVersion

    repositories {
        mavenCentral()
        maven { url = "https://repo.papermc.io/repository/maven-public/" }
        maven { url = 'https://repo.xenondevs.xyz/releases' }
        maven { url = 'https://repo.spongepowered.org/maven' }
        maven { url = 'https://maven.enginehub.org/repo/' }
        maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
        maven { url = "https://nexus.sirblobman.xyz/public/" }
        maven { url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/" }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release.set(21)
        options.compilerArgs += ['-parameters', '-Xlint:deprecation', '-Xlint:unchecked']
    }

    plugins.withId('io.papermc.paperweight.userdev') {
        def toolchains = extensions.getByType(org.gradle.jvm.toolchain.JavaToolchainService)
        def targetVersion = (project.path == ':versions:v26_1' || project.path == ':versions:v26_2') ? 25 : 21

        tasks.withType(io.papermc.paperweight.tasks.JavaLauncherTask).configureEach {
            launcher.set(toolchains.launcherFor {
                languageVersion = org.gradle.jvm.toolchain.JavaLanguageVersion.of(targetVersion)
            })
        }
    }
}

tasks.register('publishApiDocs', Sync) {
    group = 'documentation'
    description = 'Genera le Javadocs del modulo mcbot-api e le copia solo in docs/mcbot/.'

    dependsOn ':mcbot-api:javadoc'

    from(project(':mcbot-api').tasks.named('javadoc').map { it.destinationDir })

    into(layout.projectDirectory.dir('docs/mcbot'))

    doLast {
        file("$rootDir/docs/.nojekyll").text = ''
    }
}

tasks.register('publishSdkDocs', Sync) {
    group = 'documentation'
    description = 'Genera le Javadocs del modulo mcbot-sdk e le copia in docs/mcbot-sdk/.'

    dependsOn ':mcbot-sdk:javadoc'

    from(project(':mcbot-sdk').tasks.named('javadoc').map { it.destinationDir })

    into(layout.projectDirectory.dir('docs/mcbot-sdk'))

    doLast {
        file("$rootDir/docs/.nojekyll").text = ''
    }
}

tasks.register('publishAllDocs') {
    group = 'documentation'
    description = 'Genera e copia tutte le Javadocs pubbliche.'
    dependsOn 'publishApiDocs', 'publishSdkDocs'
}
