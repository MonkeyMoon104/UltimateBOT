version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "gradle"
    groups:
      gradle-plugins:
        patterns:
          - "io.papermc.paperweight*"
          - "com.gradleup.shadow"
          - "net.ltgt.errorprone*"
          - "com.diffplug.spotless"
          - "org.revapi*"
          - "it.monkeymoon104.api-publish"
      test-libs:
        patterns:
          - "org.junit*"
          - "org.mockito*"
          - "org.assertj*"
          - "org.awaitility*"
          - "com.tngtech.archunit*"
          - "org.mockbukkit*"
    ignore:
      # Dual catalog aliases share one Maven coordinate; a major bump would rewrite
      # caffeine-legacy (must stay on 2.x for Java 8). Apply major Caffeine upgrades manually.
      - dependency-name: "com.github.ben-manes.caffeine:caffeine"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
