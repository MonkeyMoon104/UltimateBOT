gui:
  tab-border:
    material: BLACK_STAINED_GLASS_PANE
    name: ' '
  tab-item:
    tab-0:
      selected:
        material: SHIELD
        name: '&eKit &7(sélectionné)'
      unselected:
        material: SHIELD
        name: '&7Kit'
    tab-1:
      selected:
        material: GLOWSTONE_DUST
        name: '&eRang &7(sélectionné)'
      unselected:
        material: GUNPOWDER
        name: '&7Rang'
    tab-2:
      selected:
        material: DRAGON_HEAD
        name: '&ePropriétaires &7(sélectionné)'
      unselected:
        material: DRAGON_HEAD
        name: '&7Propriétaires'
    tab-3:
      selected:
        material: TARGET
        name: '&eCibles &7(sélectionné)'
      unselected:
        material: TARGET
        name: '&7Cibles'
  owners-tab:
    head:
      name: '&e%player%'
      lore:
      - '&7Propriétaire du bot'
      - ''
      - '&8UUID: &7%uuid%'
    scroll-up:
      name: '&aDéfiler vers le haut'
      cant-scroll: '&7Vous êtes déjà tout en haut'
    scroll-down:
      name: '&aDéfiler vers le bas'
      cant-scroll: '&7Vous êtes déjà tout en bas'
  targets-tab:
    head:
      name: '&c%player%'
      lore:
      - '&7Cible du bot'
      - ''
      - '&8UUID: &7%uuid%'
    scroll-up:
      name: '&aDéfiler vers le haut'
      cant-scroll: '&7Vous êtes déjà tout en haut'
    scroll-down:
      name: '&aDéfiler vers le bas'
      cant-scroll: '&7Vous êtes déjà tout en bas'
  default-armor:
    helmet: NETHERITE
    chestplate: NETHERITE
    leggings: NETHERITE
    boots: NETHERITE
    no-armor: BARRIER
    blast-enabled-text: '&aON'
    blast-disabled-text: '&cOFF'
    lore:
      set-type:
      - '&7Type : &e%type%'
      - '&7Protection contre les explosions : %blast_state%'
      - ''
      - '&eClic gauche : &7changer la pièce d''armure'
      - '&eClic droit : &7activer/désactiver blast'
  follow-button:
    name: '&bBasculer Follow'
    material: LEAD
    lore:
    - '&7Statut : &e%type%'
    - ''
    - '&eCliquez pour basculer follow'
  spawn-button:
    name: '&aFaire apparaître le bot'
    material: SPAWNER
    lore:
    - '&7Faites apparaître votre bot d''entraînement'
    - '&7avec la configuration sélectionnée'
    - ''
    - '&eCliquez pour faire apparaître !'
  despawn-button:
    name: '&cSupprimer le bot'
    material: BARRIER
    lore:
    - '&7Supprime votre bot d''entraînement'
    - '&7du monde'
    - ''
    - '&cCliquez pour supprimer !'
  save-button:
    name: '&aEnregistrer les modifications'
    material: GREEN_WOOL
    lore:
    - '&7Enregistre les paramètres actuels'
    - '&7sur le bot actif'
    - ''
    - '&aCliquez pour enregistrer !'
  totem-button:
    name: '&eNombre de totems'
    material: TOTEM_OF_UNDYING
    unlimited-text: Illimité
    lore:
    - '&7Nombre actuel : &a%count%'
    - ''
    - '&eClic gauche : &a+1'
    - '&eClic droit : &c-1'
    - '&7(-1 = Totems illimités)'
  teleport-button:
    name: '&5Téléporter le bot'
    material: ENDER_PEARL
    lore:
    - '&dTéléporte le bot à votre position'
  combat-button:
    name: '&bBasculer Combat'
    material: NETHERITE_SWORD
    lore:
    - '&7Statut : &e%type%'
    - ''
    - '&eCliquez pour basculer le combat'
  rank-button:
    name: '&bRang'
    material: DIAMOND_SWORD
    ranks-mat:
      easy: SMALL_AMETHYST_BUD
      normal: SMALL_AMETHYST_BUD
      medium: MEDIUM_AMETHYST_BUD
      hard: LARGE_AMETHYST_BUD
      god: AMETHYST_CLUSTER
    lore:
    - ''
    - '%ranks%'
    - ''
    - '&eCliquez pour augmenter/diminuer le rang'
