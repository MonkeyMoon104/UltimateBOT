gui:

  tab-border:
    material: "BLACK_STAINED_GLASS_PANE"
    name: " "

  tab-item:
    tab-0:
      selected:
        material: "SHIELD"
        name: "&eKit &7(selezionato)"
      unselected:
        material: "SHIELD"
        name: "&7Kit"
    tab-1:
      selected:
        material: "GLOWSTONE_DUST"
        name: "&eRango &7(selezionato)"
      unselected:
        material: "GUNPOWDER"
        name: "&7Rango"
    tab-2:
      selected:
        material: "DRAGON_HEAD"
        name: "&eProprietari &7(selezionato)"
      unselected:
        material: "DRAGON_HEAD"
        name: "&7Proprietari"
    tab-3:
      selected:
        material: "TARGET"
        name: "&eBersagli &7(selezionato)"
      unselected:
        material: "TARGET"
        name: "&7Bersagli"

  owners-tab:
    head:
      name: "&e%player%"
      lore:
        - "&7Proprietario del bot"
        - ""
        - "&8UUID: &7%uuid%"
    scroll-up:
      name: "&aScorri su"
      cant-scroll: "&7Sei già in cima"
    scroll-down:
      name: "&aScorri giù"
      cant-scroll: "&7Sei già in fondo"

  targets-tab:
    head:
      name: "&c%player%"
      lore:
        - "&7Bersaglio del bot"
        - ""
        - "&8UUID: &7%uuid%"
    scroll-up:
      name: "&aScorri su"
      cant-scroll: "&7Sei già in cima"
    scroll-down:
      name: "&aScorri giù"
      cant-scroll: "&7Sei già in fondo"

  default-armor:
    helmet: NETHERITE
    chestplate: NETHERITE
    leggings: NETHERITE
    boots: NETHERITE
    no-armor: BARRIER
    blast-enabled-text: "&aATTIVO"
    blast-disabled-text: "&cDISATTIVO"
    lore:
      set-type:
        - "&7Tipo: &e%type%"
        - "&7Protezione esplosioni: %blast_state%"
        - ""
        - "&eClick sinistro: &7cambia il pezzo d'armatura"
        - "&eClick destro: &7attiva/disattiva esplosioni"

  follow-button:
    name: "&bAttiva/Disattiva Seguimento"
    material: "LEAD"
    lore:
      - "&7Stato: &e%type%"
      - ""
      - "&eClicca per attivare/disattivare il seguimento"

  spawn-button:
    name: "&aGenera Bot"
    material: "SPAWNER"
    lore:
      - "&7Genera il tuo bot di allenamento"
      - "&7con la configurazione selezionata"
      - ""
      - "&eClicca per generare!"

  despawn-button:
    name: "&cRimuovi Bot"
    material: "BARRIER"
    lore:
      - "&7Rimuovi il tuo bot di allenamento"
      - "&7dal mondo"
      - ""
      - "&cClicca per rimuovere!"

  save-button:
    name: "&aSalva Modifiche"
    material: "GREEN_WOOL"
    lore:
      - "&7Salva le impostazioni correnti"
      - "&7nel bot attivo"
      - ""
      - "&aClicca per salvare!"

  totem-button:
    name: "&eContatore Totem"
    material: "TOTEM_OF_UNDYING"
    unlimited-text: "Illimitati"
    lore:
      - "&7Contatore attuale: &a%count%"
      - ""
      - "&eClick sinistro: &a+1"
      - "&eClick destro: &c-1"
      - "&7(-1 = Totem illimitati)"

  teleport-button:
    name: "&5Teletrasporta Bot"
    material: "ENDER_PEARL"
    lore:
      - "&dTeletrasporta il bot alla tua posizione"

  combat-button:
    name: "&bAttiva/Disattiva Combattimento"
    material: "NETHERITE_SWORD"
    lore:
      - "&7Stato: &e%type%"
      - ""
      - "&eClicca per attivare/disattivare il combattimento"

  rank-button:
    name: "&bRango"
    material: "DIAMOND_SWORD"
    ranks-mat:
      easy: SMALL_AMETHYST_BUD
      normal: SMALL_AMETHYST_BUD
      medium: MEDIUM_AMETHYST_BUD
      hard: LARGE_AMETHYST_BUD
      god: AMETHYST_CLUSTER
    lore:
      - ""
      - "%ranks%"
      - ""
      - "&eClicca per aumentare/diminuire il rango"