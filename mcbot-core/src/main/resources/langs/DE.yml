gui:
  tab-border:
    material: BLACK_STAINED_GLASS_PANE
    name: ' '
  tab-item:
    tab-0:
      selected:
        material: SHIELD
        name: '&eKit &7(ausgewählt)'
      unselected:
        material: SHIELD
        name: '&7Kit'
    tab-1:
      selected:
        material: GLOWSTONE_DUST
        name: '&eRang &7(ausgewählt)'
      unselected:
        material: GUNPOWDER
        name: '&7Rang'
    tab-2:
      selected:
        material: DRAGON_HEAD
        name: '&eBesitzer &7(ausgewählt)'
      unselected:
        material: DRAGON_HEAD
        name: '&7Besitzer'
    tab-3:
      selected:
        material: TARGET
        name: '&eZiele &7(ausgewählt)'
      unselected:
        material: TARGET
        name: '&7Ziele'
  owners-tab:
    head:
      name: '&e%player%'
      lore:
      - '&7Bot-Besitzer'
      - ''
      - '&8UUID: &7%uuid%'
    scroll-up:
      name: '&aNach oben scrollen'
      cant-scroll: '&7Du bist bereits ganz oben'
    scroll-down:
      name: '&aNach unten scrollen'
      cant-scroll: '&7Du bist bereits ganz unten'
  targets-tab:
    head:
      name: '&c%player%'
      lore:
      - '&7Bot-Ziel'
      - ''
      - '&8UUID: &7%uuid%'
    scroll-up:
      name: '&aNach oben scrollen'
      cant-scroll: '&7Du bist bereits ganz oben'
    scroll-down:
      name: '&aNach unten scrollen'
      cant-scroll: '&7Du bist bereits ganz unten'
  default-armor:
    helmet: NETHERITE
    chestplate: NETHERITE
    leggings: NETHERITE
    boots: NETHERITE
    no-armor: BARRIER
    blast-enabled-text: '&aON'
    blast-disabled-text: '&cOFF'
    lore:
      set-type:
      - '&7Typ: &e%type%'
      - '&7Explosionsschutz: %blast_state%'
      - ''
      - '&eLinksklick: &7Rüstungsteil ändern'
      - '&eRechtsklick: &7Blast umschalten'
  follow-button:
    name: '&bFollow umschalten'
    material: LEAD
    lore:
    - '&7Status: &e%type%'
    - ''
    - '&eKlicken, um Follow umzuschalten'
  spawn-button:
    name: '&aBot spawnen'
    material: SPAWNER
    lore:
    - '&7Spawne deinen Übungs-Bot'
    - '&7mit der ausgewählten Konfiguration'
    - ''
    - '&eKlicken zum Spawnen!'
  despawn-button:
    name: '&cBot entfernen'
    material: BARRIER
    lore:
    - '&7Entferne deinen Übungs-Bot'
    - '&7aus der Welt'
    - ''
    - '&cKlicken zum Entfernen!'
  save-button:
    name: '&aÄnderungen speichern'
    material: GREEN_WOOL
    lore:
    - '&7Speichert die aktuellen Einstellungen'
    - '&7für den aktiven Bot'
    - ''
    - '&aKlicken zum Speichern!'
  totem-button:
    name: '&eTotem-Anzahl'
    material: TOTEM_OF_UNDYING
    unlimited-text: Unbegrenzt
    lore:
    - '&7Aktuelle Anzahl: &a%count%'
    - ''
    - '&eLinksklick: &a+1'
    - '&eRechtsklick: &c-1'
    - '&7(-1 = Unbegrenzte Totems)'
  teleport-button:
    name: '&5Bot teleportieren'
    material: ENDER_PEARL
    lore:
    - '&dTeleportiert den Bot zu deinem Standort'
  combat-button:
    name: '&bKampf umschalten'
    material: NETHERITE_SWORD
    lore:
    - '&7Status: &e%type%'
    - ''
    - '&eKlicken, um Kampf umzuschalten'
  rank-button:
    name: '&bRang'
    material: DIAMOND_SWORD
    ranks-mat:
      easy: SMALL_AMETHYST_BUD
      normal: SMALL_AMETHYST_BUD
      medium: MEDIUM_AMETHYST_BUD
      hard: LARGE_AMETHYST_BUD
      god: AMETHYST_CLUSTER
    lore:
    - ''
    - '%ranks%'
    - ''
    - '&eKlicken, um den Rang zu erhöhen/verringern'
