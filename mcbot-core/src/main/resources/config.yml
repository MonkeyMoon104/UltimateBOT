bot:
  name: "MincraftBot"
  totem-finish: "[%botname%] Ha finito i totem"
  default-totem-count: -1
  max-totem-normal: 37
  max-totem-event: 74
  blocked-worlds:
    - "world_nether"
    - "world_the_end"

  event:
    range: 32

  ally:
    range: 16
    pre-range: 32
    return-teleport-distance: 12
    return-teleport-cooldown-ms: 1000

  team-ally:
    range: 16
    pre-range: 32
    return-teleport-distance: 12
    return-teleport-cooldown-ms: 1000

gui:

  tab-border:
    material: "BLACK_STAINED_GLASS_PANE"
    name: " "

  tab-item:
    tab-0:
      selected:
        material: "GLOWSTONE_DUST"
        name: "&eKit &7(selezionato)"
      unselected:
        material: "GUNPOWDER"
        name: "&7Kit"
    tab-1:
      selected:
        material: "GLOWSTONE_DUST"
        name: "&eRank &7(selezionato)"
      unselected:
        material: "GUNPOWDER"
        name: "&7Rank"
    tab-2:
      selected:
        material: "GLOWSTONE_DUST"
        name: "&eOwners &7(selezionato)"
      unselected:
        material: "GUNPOWDER"
        name: "&7Owners"
    tab-3:
      selected:
        material: "GLOWSTONE_DUST"
        name: "&eTargets &7(selezionato)"
      unselected:
        material: "GUNPOWDER"
        name: "&7Targets"

  # Tab 2 — testa di ogni owner del bot
  owners-tab:
    head:
      name: "&e%player%"
      lore:
        - "&7Proprietario del bot"
        - ""
        - "&8UUID: &7%uuid%"

  # Tab 3 — testa di ogni target del bot
  targets-tab:
    head:
      name: "&c%player%"
      lore:
        - "&7Target del bot"
        - ""
        - "&8UUID: &7%uuid%"

  default-armor:
    helmet: NETHERITE
    chestplate: NETHERITE
    leggings: NETHERITE
    boots: NETHERITE
    no-armor: BARRIER
    blast-enabled-text: "&aON"
    blast-disabled-text: "&cOFF"
    lore:
      set-type:
        - "&7Tipo: &e%type%"
        - "&7Blast Protection: %blast_state%"
        - ""
        - "&eClick sinistro: &7cambia il pezzo d'armatura"
        - "&eClick destro: &7attiva/disattiva il blast"

  follow-button:
    name: "&bAttiva/Disattiva Segui"
    material: "LEAD"
    lore:
      - "&7Stato: &e%type%"
      - ""
      - "&eClicca per attivare/disattivare il follow"

  spawn-button:
    name: "&aGenera Bot"
    material: "SPAWNER"
    lore:
      - "&7Genera il tuo bot di allenamento"
      - "&7con la configurazione selezionata"
      - ""
      - "&eClicca per generare!"

  despawn-button:
    name: "&cRimuovi Bot"
    material: "BARRIER"
    lore:
      - "&7Rimuovi il tuo bot di allenamento"
      - "&7dal mondo"
      - ""
      - "&cClicca per rimuovere!"

  save-button:
    name: "&aSalva Modifiche"
    material: "GREEN_WOOL"
    lore:
      - "&7Salva le impostazioni attuali"
      - "&7sul bot attivo"
      - ""
      - "&aClicca per salvare!"

  totem-button:
    name: "&eConteggio Totem"
    material: "TOTEM_OF_UNDYING"
    unlimited-text: "Illimitati"
    lore:
      - "&7Conteggio attuale: &a%count%"
      - ""
      - "&eClick sinistro: &a+1"
      - "&eClick destro: &c-1"
      - "&7(-1 = Totem illimitati)"

  teleport-button:
    name: "&5Tippa bot"
    material: "ENDER_PEARL"
    lore:
      - "&dTippa il bot alla tua posizione"

  combat-button:
    name: "&bAttiva/Disattiva Combat"
    material: "NETHERITE_SWORD"
    lore:
      - "&7Stato: &e%type%"
      - ""
      - "&eClicca per attivare/disattivare il combat"

  rank-button:
    name: "&bRank"
    material: "DIAMOND_SWORD"
    ranks-mat:
      easy: SMALL_AMETHYST_BUD
      normal: SMALL_AMETHYST_BUD
      medium: MEDIUM_AMETHYST_BUD
      hard: LARGE_AMETHYST_BUD
      god: AMETHYST_CLUSTER
    lore:
      - ""
      - "%ranks%"
      - ""
      - "&eClicca per aumentare/diminuire il rank"