    owner-not-present: "&e%player% &7is not an owner of the team ally bot."
    owner-added: "&aAdded owner: &e%player%"
    owner-removed: "&aRemoved owner: &e%player%"
    min-owners-reached: "&cYou cannot go below 2 owners."
    duplicate-owner: "&cDuplicate owner in command: &e%player%"
    owner-has-active-bot: "&c%player% already has an active bot (%bottype%). Despawn it first."
    team-spawned-notify: "&aAllied bot spawned by %playerowner% for the team with these owners: &e%playerlist%"

bot:
  name: "MinecraftBot"
  totem-finish: "[%botname%] Ran out of totems"
  default-totem-count: -1
  max-totem-normal: 37
  max-totem-event: 74
  blocked-worlds:
    - "world_nether"
    - "world_the_end"

  event:
    range: 32

  ally:
    range: 16
    pre-range: 32
    return-teleport-distance: 12
    return-teleport-cooldown-ms: 1000

  team-ally:
    range: 16
    pre-range: 32
    return-teleport-distance: 12
    return-teleport-cooldown-ms: 1000

gui:

  tab-border:
    material: "BLACK_STAINED_GLASS_PANE"
    name: " "

  tab-item:
    tab-0:
      selected:
        material: "SHIELD"
        name: "&eKit &7(selected)"
      unselected:
        material: "SHIELD"
        name: "&7Kit"
    tab-1:
      selected:
        material: "GLOWSTONE_DUST"
        name: "&eRank &7(selected)"
      unselected:
        material: "GUNPOWDER"
        name: "&7Rank"
    tab-2:
      selected:
        material: "DRAGON_HEAD"
        name: "&eOwners &7(selected)"
      unselected:
        material: "DRAGON_HEAD"
        name: "&7Owners"
    tab-3:
      selected:
        material: "TARGET"
        name: "&eTargets &7(selected)"
      unselected:
        material: "TARGET"
        name: "&7Targets"

  owners-tab:
    head:
      name: "&e%player%"
      lore:
        - "&7Bot owner"
        - ""
        - "&8UUID: &7%uuid%"
    scroll-up:
      name: "&aScroll up"
      cant-scroll: "&7You are already at the top"
    scroll-down:
      name: "&aScroll down"
      cant-scroll: "&7You are already at the bottom"

  targets-tab:
    head:
      name: "&c%player%"
      lore:
        - "&7Bot target"
        - ""
        - "&8UUID: &7%uuid%"
    scroll-up:
      name: "&aScroll up"
      cant-scroll: "&7You are already at the top"
    scroll-down:
      name: "&aScroll down"
      cant-scroll: "&7You are already at the bottom"

  default-armor:
    helmet: NETHERITE
    chestplate: NETHERITE
    leggings: NETHERITE
    boots: NETHERITE
    no-armor: BARRIER
    blast-enabled-text: "&aON"
    blast-disabled-text: "&cOFF"
    lore:
      set-type:
        - "&7Type: &e%type%"
        - "&7Blast Protection: %blast_state%"
        - ""
        - "&eLeft click: &7change the armor piece"
        - "&eRight click: &7toggle blast"

  follow-button:
    name: "&bToggle Follow"
    material: "LEAD"
    lore:
      - "&7Status: &e%type%"
      - ""
      - "&eClick to toggle follow"

  spawn-button:
    name: "&aSpawn Bot"
    material: "SPAWNER"
    lore:
      - "&7Spawn your practice bot"
      - "&7with the selected configuration"
      - ""
      - "&eClick to spawn!"

  despawn-button:
    name: "&cRemove Bot"
    material: "BARRIER"
    lore:
      - "&7Remove your practice bot"
      - "&7from the world"
      - ""
      - "&cClick to remove!"

  save-button:
    name: "&aSave Changes"
    material: "GREEN_WOOL"
    lore:
      - "&7Save the current settings"
      - "&7to the active bot"
      - ""
      - "&aClick to save!"

  totem-button:
    name: "&eTotem Count"
    material: "TOTEM_OF_UNDYING"
    unlimited-text: "Unlimited"
    lore:
      - "&7Current count: &a%count%"
      - ""
      - "&eLeft click: &a+1"
      - "&eRight click: &c-1"
      - "&7(-1 = Unlimited totems)"

  teleport-button:
    name: "&5Teleport Bot"
    material: "ENDER_PEARL"
    lore:
      - "&dTeleport the bot to your location"

  combat-button:
    name: "&bToggle Combat"
    material: "NETHERITE_SWORD"
    lore:
      - "&7Status: &e%type%"
      - ""
      - "&eClick to toggle combat"

  rank-button:
    name: "&bRank"
    material: "DIAMOND_SWORD"
    ranks-mat:
      easy: SMALL_AMETHYST_BUD
      normal: SMALL_AMETHYST_BUD
      medium: MEDIUM_AMETHYST_BUD
      hard: LARGE_AMETHYST_BUD
      god: AMETHYST_CLUSTER
    lore:
      - ""
      - "%ranks%"
      - ""
      - "&eClick to increase/decrease the rank"
