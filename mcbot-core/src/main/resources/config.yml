license-key: "XXXX-XXXX-XXXX-XXXX"
lang-file: "EN.yml"

updates:
  join-notify-delay-seconds: 5
  periodic-broadcast:
    enabled: true
    interval-minutes: 30

remote-api:
  enabled: false
  host: "127.0.0.1"
  port: 8765
  base-path: "/mcbot/api/v1"
  token: "change-me"

bot:
  name: "MinecraftBot"
  default-totem-count: -1
  max-totem-normal: 37
  max-totem-event: 74
  blocked-worlds:
    - "world_nether"
    - "world_the_end"
  combat:
    infinite-resources: true
    healing: true

  guard:
    enabled: true
    detection:
      class-prefixes:
        - "com.monkey.mcbot."
      class-contains:
        - "mcbot"
      exact-names:
        - "MinecraftBot"
      name-prefixes: []
    compatibility:
      mark-as-npc-for-vault: true
      npc-metadata-key: "NPC"
      own-metadata-key: "MinecraftBotGuard"
      preload-luckperms-users: true
    protection:
      clear-fire-ticks: true
      cancel-combust-events: true
      cancel-fire-damage: true
    scanner:
      interval-ticks: 20
    debug: false

  event:
    range: 32

  ally:
    range: 16
    pre-range: 32
    return-teleport-distance: 12
    return-teleport-cooldown-ms: 1000

  team-ally:
    range: 16
    pre-range: 32
    return-teleport-distance: 12
    return-teleport-cooldown-ms: 1000
