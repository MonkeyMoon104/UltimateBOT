import io.papermc.paperweight.userdev.ReobfArtifactConfiguration

apply plugin: 'io.papermc.paperweight.userdev'

paperweight {
    reobfArtifactConfiguration = ReobfArtifactConfiguration.getREOBF_PRODUCTION()
}

def libsCatalog = extensions.getByType(org.gradle.api.artifacts.VersionCatalogsExtension).named('libs')

dependencies {
    implementation project(':mcbot-api')
    paperweight.paperDevBundle(libsCatalog.findVersion('paper-bundle-1_21_4').get().requiredVersion)

    implementation libs.bstats.bukkit
    implementation libs.jackson.databind
    implementation libs.jackson.datatype.jsr310
    implementation libs.invui.v1
    compileOnly libs.placeholderapi
    compileOnly libs.worldguard.bukkit
    compileOnly libs.sirblobman.core
    compileOnly libs.combatlogx.api
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
