    name: '&eכמות טוטמים'
    material: TOTEM_OF_UNDYING
    unlimited-text: ללא הגבלה
    lore:
    - '&7כמות נוכחית: &a%count%'
    - ''
    - '&eקליק שמאלי: &a+1'
    - '&eקליק ימני: &c-1'
    - '&7(-1 = טוטמים ללא הגבלה)'
