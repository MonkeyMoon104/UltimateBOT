    name: '&5שגר את הבוט'
    material: ENDER_PEARL
    lore:
    - '&dשגר את הבוט למיקום שלך'
  combat-button:
    name: '&bהחלף קרב'
    material: NETHERITE_SWORD
    lore:
    - '&7סטטוס: &e%type%'
    - ''
    - '&eלחץ כדי להחליף קרב'
  difficulty-button:
    name: '&bראנק'
    material: DIAMOND_SWORD
    difficulties-mat:
      easy: SMALL_AMETHYST_BUD
      normal: SMALL_AMETHYST_BUD
      medium: MEDIUM_AMETHYST_BUD
      hard: LARGE_AMETHYST_BUD
      god: AMETHYST_CLUSTER
    lore:
    - ''
    - '%difficulties%'
    - ''
    - '&eלחץ כדי להעלות/להוריד את הראנק'
