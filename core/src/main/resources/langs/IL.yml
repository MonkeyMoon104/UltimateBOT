gui:
  tab-border:
    material: BLACK_STAINED_GLASS_PANE
    name: ' '
  tab-item:
    tab-0:
      selected:
        material: SHIELD
        name: '&eקיט &7(נבחר)'
      unselected:
        material: SHIELD
        name: '&7קיט'
    tab-1:
      selected:
        material: GLOWSTONE_DUST
        name: '&eראנק &7(נבחר)'
      unselected:
        material: GUNPOWDER
        name: '&7ראנק'
    tab-2:
      selected:
        material: DRAGON_HEAD
        name: '&eבעלים &7(נבחר)'
      unselected:
        material: DRAGON_HEAD
        name: '&7בעלים'
    tab-3:
      selected:
        material: TARGET
        name: '&eמטרות &7(נבחר)'
      unselected:
        material: TARGET
        name: '&7מטרות'
