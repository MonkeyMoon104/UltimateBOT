    head:
      name: '&e%player%'
      lore:
      - '&7בעל הבוט'
      - ''
      - '&8UUID: &7%uuid%'
    scroll-up:
      name: '&aגלול למעלה'
      cant-scroll: '&7אתה כבר למעלה'
    scroll-down:
      name: '&aגלול למטה'
      cant-scroll: '&7אתה כבר למטה'
  targets-tab:
    head:
      name: '&c%player%'
      lore:
      - '&7מטרת הבוט'
      - ''
      - '&8UUID: &7%uuid%'
    scroll-up:
      name: '&aגלול למעלה'
      cant-scroll: '&7אתה כבר למעלה'
    scroll-down:
      name: '&aגלול למטה'
      cant-scroll: '&7אתה כבר למטה'
