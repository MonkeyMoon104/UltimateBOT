    helmet: NETHERITE
    chestplate: NETHERITE
    leggings: NETHERITE
    boots: NETHERITE
    no-armor: BARRIER
    blast-enabled-text: '&aON'
    blast-disabled-text: '&cOFF'
    lore:
      set-type:
      - '&7סוג: &e%type%'
      - '&7הגנת פיצוץ: %blast_state%'
      - ''
      - '&eקליק שמאלי: &7שנה את חלק השריון'
      - '&eקליק ימני: &7החלף blast'
