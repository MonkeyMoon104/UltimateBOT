    name: '&aזמן בוט'
    material: SPAWNER
    lore:
    - '&7זמן את בוט האימון שלך'
    - '&7עם ההגדרות שנבחרו'
    - ''
    - '&eלחץ כדי לזמן!'
  despawn-button:
    name: '&cהסר בוט'
    material: BARRIER
    lore:
    - '&7הסר את בוט האימון שלך'
    - '&7מהעולם'
    - ''
    - '&cלחץ כדי להסיר!'
