gui:
  tab-border:
    material: BLACK_STAINED_GLASS_PANE
    name: ' '
  tab-item:
    tab-0:
      selected:
        material: SHIELD
        name: '&eKit &7(seleccionado)'
      unselected:
        material: SHIELD
        name: '&7Kit'
    tab-1:
      selected:
        material: GLOWSTONE_DUST
        name: '&eRango &7(seleccionado)'
      unselected:
        material: GUNPOWDER
        name: '&7Rango'
    tab-2:
      selected:
        material: DRAGON_HEAD
        name: '&ePropietarios &7(seleccionado)'
      unselected:
        material: DRAGON_HEAD
        name: '&7Propietarios'
    tab-3:
      selected:
        material: TARGET
        name: '&eObjetivos &7(seleccionado)'
      unselected:
        material: TARGET
        name: '&7Objetivos'
  owners-tab:
    head:
      name: '&e%player%'
      lore:
      - '&7Propietario del bot'
      - ''
      - '&8UUID: &7%uuid%'
    scroll-up:
      name: '&aDesplazar hacia arriba'
      cant-scroll: '&7Ya estás arriba del todo'
    scroll-down:
      name: '&aDesplazar hacia abajo'
      cant-scroll: '&7Ya estás abajo del todo'
  targets-tab:
    head:
      name: '&c%player%'
      lore:
      - '&7Objetivo del bot'
      - ''
      - '&8UUID: &7%uuid%'
    scroll-up:
      name: '&aDesplazar hacia arriba'
      cant-scroll: '&7Ya estás arriba del todo'
    scroll-down:
      name: '&aDesplazar hacia abajo'
      cant-scroll: '&7Ya estás abajo del todo'
  default-armor:
    helmet: NETHERITE
    chestplate: NETHERITE
    leggings: NETHERITE
    boots: NETHERITE
    no-armor: BARRIER
    blast-enabled-text: '&aON'
    blast-disabled-text: '&cOFF'
    lore:
      set-type:
      - '&7Tipo: &e%type%'
      - '&7Protección contra explosiones: %blast_state%'
      - ''
      - '&eClic izquierdo: &7cambiar la pieza de armadura'
      - '&eClic derecho: &7activar/desactivar blast'
  follow-button:
    name: '&bAlternar Follow'
    material: LEAD
    lore:
    - '&7Estado: &e%type%'
    - ''
    - '&eHaz clic para alternar follow'
  spawn-button:
    name: '&aGenerar Bot'
    material: SPAWNER
    lore:
    - '&7Genera tu bot de práctica'
    - '&7con la configuración seleccionada'
    - ''
    - '&e¡Haz clic para generar!'
  despawn-button:
    name: '&cEliminar Bot'
    material: BARRIER
    lore:
    - '&7Elimina tu bot de práctica'
    - '&7del mundo'
    - ''
    - '&c¡Haz clic para eliminar!'
  save-button:
    name: '&aGuardar cambios'
    material: GREEN_WOOL
    lore:
    - '&7Guarda la configuración actual'
    - '&7en el bot activo'
    - ''
    - '&a¡Haz clic para guardar!'
  totem-button:
    name: '&eCantidad de tótems'
    material: TOTEM_OF_UNDYING
    unlimited-text: Ilimitados
    lore:
    - '&7Cantidad actual: &a%count%'
    - ''
    - '&eClic izquierdo: &a+1'
    - '&eClic derecho: &c-1'
    - '&7(-1 = Tótems ilimitados)'
  teleport-button:
    name: '&5Teletransportar Bot'
    material: ENDER_PEARL
    lore:
    - '&dTeletransporta el bot a tu ubicación'
  combat-button:
    name: '&bAlternar combate'
    material: NETHERITE_SWORD
    lore:
    - '&7Estado: &e%type%'
    - ''
    - '&eHaz clic para alternar el combate'
  difficulty-button:
    name: '&bRango'
    material: DIAMOND_SWORD
    difficulties-mat:
      easy: SMALL_AMETHYST_BUD
      normal: SMALL_AMETHYST_BUD
      medium: MEDIUM_AMETHYST_BUD
      hard: LARGE_AMETHYST_BUD
      god: AMETHYST_CLUSTER
    lore:
    - ''
    - '%difficulties%'
    - ''
    - '&eHaz clic para aumentar/disminuir el rango'
