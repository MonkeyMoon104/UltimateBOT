lang-file: "EN.yml"

updates:
  join-notify-delay-seconds: 5
  periodic-broadcast:
    enabled: true
    interval-minutes: 30

remote-api:
  enabled: false
  host: "127.0.0.1"
  port: 8765
  base-path: "/ultimatebot/api/v1"
  token: "change-me"

addons:
  metrics:
    # Downloads UltimateBot-Metrics.jar automatically on the next full server restart.
    enabled: false
    # Exposes authenticated Prometheus data at <remote-api.base-path>/metrics when the addon is enabled.
    prometheus-endpoint-enabled: false
  # Downloads UltimateBot-Guard.jar automatically on the next full server restart.
  # Detection and protection rules are intentionally hardcoded by the addon.
  guard:
    enabled: true

performance:
  caches:
    # Short-lived player target results. Values are validated and safely fall back to defaults.
    target:
      maximum-size: 2048
      expire-after-write-ms: 250
    # Passability checks used by pathfinding and movement.
    block-state:
      maximum-size: 1000
      expire-after-write-ms: 5000

protection-world:
  # Global permission for bot explosions to damage terrain. Per-bot settings cannot override false.
  allow-bot-explosion-block-damage: false
  # Prevents drops and removes tracked bot blocks/entities on shutdown. When false, they become normal world content.
  anti-dupe: true
  # Seconds before combat blocks are restored. Use 0 to keep them until broken or the configured limit is reached.
  combat-block-lifetime-seconds: 0
  # Hard limit that prevents combat blocks and their tracking data from growing without bounds.
  max-active-combat-blocks: 2048
  # Seconds before persistent bot entities such as unused TNT minecarts are removed. Use 0 to keep them.
  combat-entity-lifetime-seconds: 0
  # Hard limit for persistent bot-created combat entities.
  max-active-combat-entities: 512
  # Fires normal placement events so WorldGuard and other protection plugins can deny bot blocks.
  respect-protection-plugins: true

bot:
  name: "UltimateBot"
  default-totem-count: -1
  max-totem-normal: 37
  max-totem-event: 74
  blocked-worlds:
    - "world_nether"
    - "world_the_end"
  combat:
    infinite-resources: true
    healing: true
    # Default per bot. Only effective when globally allowed under protection-world.
    explosion-block-damage: false

  event:
    range: 32

  ally:
    range: 16
    pre-range: 32
    return-teleport-distance: 12
    return-teleport-cooldown-ms: 1000

  team-ally:
    range: 16
    pre-range: 32
    return-teleport-distance: 12
    return-teleport-cooldown-ms: 1000
