messages:
  spawn-bot: "&aBot generato con le impostazioni selezionate!"
  dead-bot-msg: "&aHai ucciso il bot!"
  despawn-bot: "&cBot rimosso!"
  save-changes: "&aModifiche salvate!"
  reload-no-permission: "&cNon hai il permesso di usare questo comando"
  reload-usage: "&eUtilizzo: /sbreload <config|bot|maps|all>"
  reload-config: "&aConfig ricaricata con successo"
  reload-bot: "&aTutti i bot attivi sono stati rimossi"
  reload-maps: "&aTutte le mappe dei player sono state pulite"
  reload-all: "&aConfigurazione, bot e mappe sono state ricaricate/pulite"
  reload-invalid-option: "&cOpzione non valida. Usa: config, bot, maps, all"
  combat-need-follow: "&cFollow deve essere ON per abilitare il combat del bot"
  dead-bot-message: "{player} was killed by his Bot"

bot:
  name: "CrystalBot" # ora si può mettere anche -> name: "%player%Bot", esempio output bot name: MonkeyMoon104Bot
  totem-finish: "[%botname%] Ha finito i totem"
  default-totem-count: -1

gui:
  default-armor:
    helmet: NETHERITE
    chestplate: NETHERITE
    leggings: NETHERITE
    boots: NETHERITE
    no-armor: BARRIER
    lore:
      set-type:
        - "&7Tipo: &e%type%"
        - "&8Clicca per cambiare il pezzo d'armatura"

  follow-button:
    name: "&bAttiva/Disattiva Segui"
    material: "LEAD"
    lore:
      - "&7Stato: &e%type%"
      - ""
      - "&eClicca per attivare/disattivare il follow"

  spawn-button:
    name: "&aGenera Bot"
    material: "SPAWNER"
    lore:
      - "&7Genera il tuo bot di allenamento"
      - "&7con la configurazione selezionata"
      - ""
      - "&eClicca per generare!"

  despawn-button:
    name: "&cRimuovi Bot"
    material: "BARRIER"
    lore:
      - "&7Rimuovi il tuo bot di allenamento"
      - "&7dal mondo"
      - ""
      - "&cClicca per rimuovere!"

  save-button:
    name: "&aSalva Modifiche"
    material: "GREEN_WOOL"
    lore:
      - "&7Salva le impostazioni attuali"
      - "&7sul bot attivo"
      - ""
      - "&aClicca per salvare!"

  totem-button:
    name: "&eConteggio Totem"
    material: "TOTEM_OF_UNDYING"
    unlimited-text: "Illimitati"
    lore:
      - "&7Conteggio attuale: &a%count%"
      - ""
      - "&eClick sinistro: &a+1"
      - "&eClick destro: &c-1"
      - "&7(-1 = Totem illimitati)"

  teleport-button:
    name: "&5Tippa bot"
    material: "ENDER_PEARL"
    lore:
      - "&dTippa il bot alla tua posizione"

  enchant-button:
    enabled-name: "&aBlast Protection: ON"
    disabled-name: "&cBlast Protection: OFF"
    enabled-material: "LIME_STAINED_GLASS_PANE"
    disabled-material: "GLASS_PANE"
    enabled-lore:
      - "&7Protezione esplosioni: &aAttiva"
      - ""
      - "&cClicca per disabilitare"
    disabled-lore:
      - "&7Protezione esplosioni: &cInattiva"
      - ""
      - "&aClicca per abilitare"
    fallback-enabled-lore: "&aClicca per disabilitare"
    fallback-disabled-lore: "&cClicca per abilitare"

  combat-button:
    name: "&bAttiva/Disattiva Combat"
    material: "NETHERITE_SWORD"
    lore:
      - "&7Stato: &e%type%"
      - "&7Rank: %rank%"
      - ""
      - "&eClicca per aumentare/disattivare il combat"


